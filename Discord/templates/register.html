<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren - Midnight</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Spezifisches Styling für die Auth-Seiten */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-4);
            height: 100vh;
            margin: 0;
            font-family: var(--font);
        }

        .auth-card {
            background: var(--bg-3);
            padding: 32px;
            border-radius: 8px;
            width: 480px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--bg-1);
        }

        .auth-card h2 {
            text-align: center;
            color: var(--text-1);
            margin-bottom: 8px;
            font-size: 24px;
        }

        .auth-card p {
            text-align: center;
            color: var(--text-3);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--text-2);
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: var(--bg-4);
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 3px;
            color: var(--text-1);
            font-size: 16px;
            box-sizing: border-box;
            transition: border 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent-blurple);
            outline: none;
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            background: var(--accent-blurple);
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .auth-button:hover {
            background: oklch(60% 0.1 215); /* Etwas dunkleres Blurple */
        }

        .auth-footer {
            margin-top: 16px;
            font-size: 14px;
        }

        .link {
            color: var(--accent-blurple);
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }

        /* Flash Messages (Fehlermeldungen) */
        .flash-messages {
            background: var(--red-2);
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Konto erstellen</h2>
        <p>Werde Teil der Midnight-Community!</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash-messages">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Benutzername</label>
                <input type="text" id="username" name="username" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="auth-button">Fortfahren</button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('login') }}" class="link">Hast du bereits ein Konto?</a>
        </div>
    </div>

</body>
</html>
