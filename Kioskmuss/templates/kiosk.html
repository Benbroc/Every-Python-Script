<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background: #000; color: white; margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; width: 100vw; height: 100vh; }
        #stage { position: relative; width: 100%; height: 100%; }
        .element { position: absolute; transform: translate(-50%, -50%); transition: left 0.1s linear, top 0.1s linear; }
        
        /* Damit Bilder am Kiosk nicht den ganzen Bildschirm sprengen */
        .element img { max-width: 300px; height: auto; border: 2px solid rgba(255,255,255,0.1); }
        .element h1 { font-size: 3rem; margin: 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }

        /* Info Box unten rechts */
        #system-info {
            position: fixed; bottom: 15px; right: 15px;
            background: rgba(30, 30, 30, 0.8); padding: 10px;
            border-radius: 5px; font-size: 11px; border: 1px solid #333;
            color: #888; z-index: 1000;
        }
        .status-dot { height: 8px; width: 8px; background: #28a745; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
    <div id="stage"></div>

    <div id="system-info">
        <div><span class="status-dot"></span> LIVE CONNECTION</div>
        <div id="os-info" style="margin-top:5px;">System: ...</div>
        <div id="browser-info">Browser: ...</div>
    </div>

    <script>
        var socket = io();
        const stage = document.getElementById('stage');

        // System Informationen auslesen
        document.getElementById('os-info').innerText = "OS: " + navigator.platform;
        document.getElementById('browser-info').innerText = "App: " + navigator.appName;

        function renderItem(data) {
            if(document.getElementById(data.id)) return;
            let el = document.createElement('div');
            el.id = data.id;
            el.className = 'element';
            el.style.left = data.x + "px";
            el.style.top = data.y + "px";
            
            if(data.type === 'text') {
                el.innerHTML = `<h1>${data.content}</h1>`;
            } else if(data.type === 'image') {
                el.innerHTML = `<img src="${data.content}">`;
            }
            stage.appendChild(el);
        }

        socket.on('new_element', renderItem);

        socket.on('sync_all', function(data) {
            stage.innerHTML = '';
            for(let id in data) { renderItem({id: id, ...data[id]}); }
        });

        socket.on('update_element', function(data) {
            let el = document.getElementById(data.id);
            if(el) {
                el.style.left = data.x + "px";
                el.style.top = data.y + "px";
            }
        });
    </script>
</body>
</html>
